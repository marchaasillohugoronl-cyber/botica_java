<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Productos</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Productos</h4>
        <a th:href="@{/productos/nuevo}" sec:authorize="hasRole('ADMIN')"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
        </a>
    </div>

    <!-- Búsqueda -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body py-2">
            <form th:action="@{/productos}" method="get" class="d-flex gap-2">
                <input type="text" name="q" class="form-control" placeholder="Buscar por nombre, código o laboratorio..."
                       th:value="${q}"/>
                <button type="submit" class="btn btn-primary px-3">
                    <i class="bi bi-search"></i>
                </button>
                <a th:href="@{/productos}" class="btn btn-outline-secondary">
                    <i class="bi bi-x"></i>
                </a>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3" style="width:60px">Foto</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Presentación</th>
                        <th>Laboratorio</th>
                        <th class="text-end">Precio</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Vence</th>
                        <th class="text-center" sec:authorize="hasRole('ADMIN')">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${productos}">
                        <td class="ps-3">
                            <img th:if="${p.imagenPath != null}"
                                 th:src="${@servicioAlmacenamiento.obtenerUrlPublica(p.imagenPath)}"
                                 class="rounded" width="45" height="45" style="object-fit:cover;"
                                 alt=""/>
                            <div th:unless="${p.imagenPath != null}"
                                 class="rounded bg-light d-flex align-items-center justify-content-center"
                                 style="width:45px;height:45px">
                                <i class="bi bi-capsule text-muted"></i>
                            </div>
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${p.nombre}"></div>
                            <div class="text-muted small" th:text="${p.codigoBarras}"></div>
                        </td>
                        <td>
                            <span th:if="${p.categoria != null}"
                                  class="badge bg-primary bg-opacity-10 text-primary"
                                  th:text="${p.categoria.nombre}"></span>
                        </td>
                        <td class="small" th:text="${p.presentacion + ' ' + (p.concentracion ?: '')}"></td>
                        <td class="small text-muted" th:text="${p.laboratorio}"></td>
                        <td class="text-end fw-bold text-success">
                            S/ <span th:text="${#numbers.formatDecimal(p.precioVenta, 1, 2)}"></span>
                        </td>
                        <td class="text-center">
                            <span th:classappend="${p.stock <= p.stockMinimo} ? 'bg-danger' : 'bg-success'"
                                  class="badge rounded-pill"
                                  th:text="${p.stock} + ' uds'"></span>
                        </td>
                        <td class="text-center small">
                            <span th:if="${p.fechaVencimiento != null}"
                                  th:text="${#temporals.format(p.fechaVencimiento, 'MM/yyyy')}"></span>
                            <span th:unless="${p.fechaVencimiento != null}" class="text-muted">-</span>
                        </td>
                        <td class="text-center" sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/productos/eliminar/{id}(id=${p.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Desactivar este producto?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay productos
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
