<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Detalle Venta</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0">Detalle de Venta #<span th:text="${venta.id}"></span></h4>
    </div>
    <div class="row g-3">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr><th class="ps-3">Producto</th><th class="text-center">Cant.</th><th class="text-end">P.Unit</th><th class="text-end pe-3">Subtotal</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${venta.detalles}">
                            <td class="ps-3 fw-semibold" th:text="${d.producto.nombre}"></td>
                            <td class="text-center" th:text="${d.cantidad}"></td>
                            <td class="text-end">S/ <span th:text="${#numbers.formatDecimal(d.precioUnitario,1,2)}"></span></td>
                            <td class="text-end pe-3 fw-bold">S/ <span th:text="${#numbers.formatDecimal(d.subtotal,1,2)}"></span></td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr><td colspan="3" class="text-end fw-bold pe-3">TOTAL</td>
                            <td class="text-end pe-3 fw-bold text-success">S/ <span th:text="${#numbers.formatDecimal(venta.total,1,2)}"></span></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Información</h6>
                    <dl class="row small mb-0">
                        <dt class="col-5">Cliente</dt><dd class="col-7" th:text="${venta.clienteNombre ?: 'Varios'}"></dd>
                        <dt class="col-5">Comprobante</dt>
                        <dd class="col-7" th:text="${venta.comprobante != null ? venta.comprobante.serie + '-' + venta.comprobante.correlativo : '-'}"></dd>
                        <dt class="col-5">SUNAT</dt>
                        <dd class="col-7" th:text="${venta.comprobante != null ? venta.comprobante.estadoSunat : '-'}"></dd>
                        <dt class="col-5">Vendedor</dt><dd class="col-7" th:text="${venta.usuario.nombre}"></dd>
                        <dt class="col-5">Fecha</dt><dd class="col-7" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></dd>
                    </dl>
                    <a th:href="@{/ventas/{id}/comprobante(id=${venta.id})}" class="btn btn-outline-primary btn-sm mt-3 w-100">
                        <i class="bi bi-printer me-1"></i>Imprimir Comprobante
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
