<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Categoría</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/categorias}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0" th:text="${categoria.id == null} ? 'Nueva Categoría' : 'Editar Categoría'"></h4>
    </div>
    <div class="card border-0 shadow-sm" style="max-width:500px">
        <div class="card-body p-4">
            <form th:action="@{/categorias/guardar}" method="post" th:object="${categoria}">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                    <input th:field="*{nombre}" type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                           placeholder="Ej: Analgésicos"/>
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="2"
                              placeholder="Descripción opcional"></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Guardar
                    </button>
                    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
