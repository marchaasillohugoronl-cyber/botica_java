<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Categorías</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-tags me-2 text-primary"></i>Categorías</h4>
        <a th:href="@{/categorias/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Nueva Categoría
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">#</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th class="text-center">Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}">
                    <td class="ps-3 text-muted small" th:text="${c.id}"></td>
                    <td class="fw-semibold" th:text="${c.nombre}"></td>
                    <td class="text-muted small" th:text="${c.descripcion}"></td>
                    <td class="text-center">
                        <span th:if="${c.activo}" class="badge bg-success">Activo</span>
                        <span th:unless="${c.activo}" class="badge bg-secondary">Inactivo</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/categorias/editar/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:if="${c.activo}" th:action="@{/categorias/eliminar/{id}(id=${c.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Desactivar esta categoría?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
