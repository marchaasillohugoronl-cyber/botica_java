<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'">Producto</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/productos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="fw-bold mb-0" th:text="${producto.id == null} ? 'Nuevo Producto' : 'Editar Producto'"></h4>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="@{/productos/guardar}" method="post" enctype="multipart/form-data"
                  th:object="${producto}">
                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{imagenPath}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <!-- Columna izquierda -->
                    <div class="col-md-8">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Nombre del Producto <span class="text-danger">*</span></label>
                                <input th:field="*{nombre}" type="text" class="form-control"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                       placeholder="Ej: Paracetamol 500mg x20"/>
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Código de Barras</label>
                                <input th:field="*{codigoBarras}" type="text" class="form-control"
                                       placeholder="EAN-13 o código interno"/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Categoría</label>
                                <select name="categoriaId" class="form-select">
                                    <option value="">-- Sin categoría --</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.id}"
                                            th:text="${cat.nombre}"
                                            th:selected="${producto.categoria != null and producto.categoria.id == cat.id}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Laboratorio</label>
                                <input th:field="*{laboratorio}" type="text" class="form-control"
                                       placeholder="Ej: Bayer, Grunenthal"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Presentación</label>
                                <input th:field="*{presentacion}" type="text" class="form-control"
                                       placeholder="Tabletas, Cápsulas..."/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Concentración</label>
                                <input th:field="*{concentracion}" type="text" class="form-control"
                                       placeholder="500mg, 10mg/ml"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Precio de Venta <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input th:field="*{precioVenta}" type="number" step="0.01" min="0"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:errors="*{precioVenta}"></div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Precio de Compra</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input th:field="*{precioCompra}" type="number" step="0.01" min="0"
                                           class="form-control"/>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Stock Actual</label>
                                <input th:field="*{stock}" type="number" min="0" class="form-control"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Stock Mínimo</label>
                                <input th:field="*{stockMinimo}" type="number" min="0" class="form-control"/>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Unidad de Medida</label>
                                <select th:field="*{unidadMedida}" class="form-select">
                                    <option value="UND">Unidad (UND)</option>
                                    <option value="BLS">Blíster (BLS)</option>
                                    <option value="FRS">Frasco (FRS)</option>
                                    <option value="CJA">Caja (CJA)</option>
                                    <option value="AMP">Ampolla (AMP)</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Fecha de Vencimiento</label>
                                <input th:field="*{fechaVencimiento}" type="date" class="form-control"/>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="2"
                                          placeholder="Indicaciones, contraindicaciones..."></textarea>
                            </div>
                            <div class="col-md-4">
                                <div class="form-check form-switch mt-2">
                                    <input th:field="*{requiereReceta}" class="form-check-input" type="checkbox"/>
                                    <label class="form-check-label">Requiere receta médica</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Columna derecha - Imagen -->
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Foto del Producto</label>
                        <div class="border rounded-3 p-3 text-center bg-light" id="imgPreviewBox">
                            <img th:if="${producto.imagenPath != null}"
                                 th:src="${@servicioAlmacenamiento.obtenerUrlPublica(producto.imagenPath)}"
                                 id="imgPreview" class="img-fluid rounded mb-2" style="max-height:200px;"
                                 alt="Foto del producto"/>
                            <div th:unless="${producto.imagenPath != null}" id="imgPlaceholder">
                                <i class="bi bi-image fs-1 text-muted"></i>
                                <p class="text-muted small mt-2 mb-0">Sin imagen</p>
                            </div>
                        </div>
                        <input type="file" name="imagenFile" class="form-control mt-2"
                               accept="image/*" onchange="previewImagen(this)"/>
                        <div class="text-muted small mt-1">JPG, PNG, GIF. Máximo 5MB.</div>
                    </div>
                </div>

                <hr class="my-4"/>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-2"></i>Guardar Producto
                    </button>
                    <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
function previewImagen(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            let img = document.getElementById('imgPreview');
            const placeholder = document.getElementById('imgPlaceholder');
            if (!img) {
                img = document.createElement('img');
                img.id = 'imgPreview';
                img.className = 'img-fluid rounded mb-2';
                img.style.maxHeight = '200px';
                document.getElementById('imgPreviewBox').prepend(img);
            }
            img.src = e.target.result;
            if (placeholder) placeholder.style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
</body>
</html>
