<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar Sesión | Botica Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%); min-height: 100vh; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-header { background: linear-gradient(135deg, #1976d2, #1565c0); border-radius: 16px 16px 0 0; }
        .form-control:focus { border-color: #1976d2; box-shadow: 0 0 0 0.2rem rgba(25,118,210,.25); }
        .btn-login { background: linear-gradient(135deg, #1976d2, #1565c0); border: none; }
        .btn-login:hover { background: linear-gradient(135deg, #1565c0, #0d47a1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card border-0">
                <div class="login-header text-white text-center py-4 px-4">
                    <i class="bi bi-capsule-pill" style="font-size: 3rem;"></i>
                    <h4 class="fw-bold mt-2 mb-0">Botica Salud</h4>
                    <p class="small opacity-75 mb-0">Sistema de Gestión</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span th:text="${error}"></span>
                    </div>
                    <div th:if="${mensaje}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle me-1"></i>
                        <span th:text="${mensaje}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-person text-primary"></i>
                                </span>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Ingrese su usuario" autofocus required/>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-lock text-primary"></i>
                                </span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Ingrese su contraseña" required/>
                            </div>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-login btn-primary py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center text-muted small py-3 bg-light rounded-bottom">
                    <i class="bi bi-shield-lock me-1"></i>Acceso restringido al personal autorizado
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
