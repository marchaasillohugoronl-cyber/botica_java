<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | ' + (${appConfig?.farmaciaName} ?: 'Botica Salud')">Botica Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>

<body th:fragment="layout(title, content)">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link th:href="@{/css/style.css}" rel="stylesheet"/>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="wrapper">

    <!-- ══ SIDEBAR ════════════════════════════════════════ -->
    <nav class="sidebar" id="sidebar">

        <!-- Brand con logo dinámico -->
        <a class="sidebar-brand" th:href="@{/dashboard}">
            <div class="sidebar-logo">
                <img th:if="${logoUrl}" th:src="${logoUrl}" alt="logo"
                     style="width:26px;height:26px;object-fit:contain;border-radius:4px"/>
                <i th:if="${logoUrl == null}" class="bi bi-capsule-pill"></i>
            </div>
            <div>
                <div class="sidebar-brand-name"
                     th:text="${appConfig?.farmaciaName ?: 'Botica Salud'}">Botica Salud</div>
                <div class="sidebar-brand-sub"
                     th:text="${appConfig?.farmaciaSubtitle ?: 'Sistema de Gestión'}">Sistema de Gestión</div>
            </div>
        </a>

        <!-- Nav links -->
        <nav class="sidebar-nav">

            <div class="sidebar-section">Principal</div>

            <a class="sidebar-link" th:href="@{/dashboard}" data-path="/dashboard,/">
                <span class="sl-icon"><i class="bi bi-house-fill"></i></span>
                Inicio
            </a>

            <a class="sidebar-link" th:href="@{/ventas/nueva}" data-path="/ventas/nueva">
                <span class="sl-icon"><i class="bi bi-cart-plus"></i></span>
                Nueva Venta
            </a>

            <div class="sidebar-section">Gestión</div>

            <a class="sidebar-link" th:href="@{/ventas}" data-path="/ventas">
                <span class="sl-icon"><i class="bi bi-receipt"></i></span>
                Ventas
            </a>

            <a class="sidebar-link" th:href="@{/productos}" data-path="/productos">
                <span class="sl-icon"><i class="bi bi-box-seam"></i></span>
                Productos
            </a>

            <a class="sidebar-link" th:href="@{/categorias}"
               sec:authorize="hasRole('ADMIN')" data-path="/categorias">
                <span class="sl-icon"><i class="bi bi-tags"></i></span>
                Categorías
            </a>

            <!-- Configuración (solo admin) -->
            <div class="sidebar-section" sec:authorize="hasRole('ADMIN')">Sistema</div>

            <a class="sidebar-link" th:href="@{/configuracion}"
               sec:authorize="hasRole('ADMIN')" data-path="/configuracion">
                <span class="sl-icon"><i class="bi bi-gear"></i></span>
                Configuración
            </a>

        </nav>

        <!-- Footer usuario -->
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-avatar" id="userAvatar">U</div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="sidebar-uname" sec:authentication="name">Usuario</div>
                    <div class="sidebar-urole">
                        <span sec:authorize="hasRole('ADMIN')">Administrador</span>
                        <span sec:authorize="hasRole('VENDEDOR')">Vendedor</span>
                    </div>
                </div>
                <a th:href="@{/logout}" class="sidebar-logout" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
        </div>

    </nav>
    <!-- ══ FIN SIDEBAR ════════════════════════════════════ -->

    <!-- ══ CONTENIDO PRINCIPAL ═══════════════════════════ -->
    <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">
            <button class="topbar-toggle" onclick="toggleSidebar()" aria-label="Menú">
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-title" id="topbarTitle"></div>
            <div class="topbar-right">
                <span class="badge rounded-pill text-bg-primary d-none d-sm-inline"
                      sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-shield-check me-1"></i>Admin
                </span>
                <span class="badge rounded-pill text-bg-secondary d-none d-sm-inline"
                      sec:authorize="hasRole('VENDEDOR')">
                    <i class="bi bi-person-badge me-1"></i>Vendedor
                </span>
                <a th:href="@{/ventas/nueva}"
                   class="btn btn-sm btn-primary d-none d-md-inline-flex align-items-center gap-1 ms-1">
                    <i class="bi bi-cart-plus"></i>
                    <span>Nueva Venta</span>
                </a>
            </div>
        </header>

        <!-- Contenido de página -->
        <main class="page-content">

            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:replace="${content}"></div>

        </main>
    </div>
    <!-- ══ FIN CONTENIDO ══════════════════════════════════ -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('show');
    }
    document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

    document.getElementById('topbarTitle').textContent =
        document.title.replace(/\s*\|.*/, '').trim();

    const av = document.getElementById('userAvatar');
    const uname = document.querySelector('.sidebar-uname');
    if (av && uname) av.textContent = (uname.textContent.trim()[0] || 'U').toUpperCase();

    const THEMES = {
        dark:   { bg:'#0f172a', border:'rgba(255,255,255,.06)', accent:'#3b82f6' },
        blue:   { bg:'#1e3a5f', border:'rgba(255,255,255,.08)', accent:'#60a5fa' },
        green:  { bg:'#14532d', border:'rgba(255,255,255,.08)', accent:'#34d399' },
        purple: { bg:'#3b0764', border:'rgba(255,255,255,.08)', accent:'#a78bfa' },
        slate:  { bg:'#334155', border:'rgba(255,255,255,.1)',  accent:'#94a3b8' },
    };
    function applyTheme(key) {
        const t = THEMES[key] || THEMES.dark;
        const root = document.documentElement;
        root.style.setProperty('--sidebar-bg',     t.bg);
        root.style.setProperty('--sidebar-border', t.border);
        root.style.setProperty('--sidebar-accent', t.accent);
        document.querySelectorAll('.tp-dot').forEach(d =>
            d.classList.toggle('active', d.dataset.theme === key));
        localStorage.setItem('sidebarTheme', key);
    }
    document.querySelectorAll('.tp-dot').forEach(d =>
        d.addEventListener('click', () => applyTheme(d.dataset.theme)));
    applyTheme(localStorage.getItem('sidebarTheme') || 'dark');

    const path = window.location.pathname;
    document.querySelectorAll('.sidebar-link[data-path]').forEach(link => {
        const paths = link.dataset.path.split(',');
        const isActive = paths.some(p => {
            if (p === '/dashboard' || p === '/') return path === '/dashboard' || path === '/';
            if (p === '/ventas/nueva') return path === '/ventas/nueva';
            return path.startsWith(p) && path !== '/ventas/nueva';
        });
        if (isActive) link.classList.add('active');
    });
</script>
</body>
</html>
