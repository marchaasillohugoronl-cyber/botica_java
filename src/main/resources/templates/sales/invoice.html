<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Comprobante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; }
            .invoice-box { border: none !important; box-shadow: none !important; }
        }
        body { background: #f5f5f5; }
        .invoice-box {
            max-width: 720px; margin: 30px auto;
            background: white; border-radius: 8px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .comprobante-titulo {
            background: #1565c0; color: white;
            padding: 0.75rem 1.5rem; border-radius: 6px;
            text-align: center;
        }
        .linea { border-top: 2px dashed #ddd; margin: 1rem 0; }
        .totales-row { font-weight: bold; }
        .sunat-badge { font-size: 0.7rem; }
    </style>
</head>
<body>
<div class="invoice-box">
    <!-- Botones no imprimibles -->
    <div class="no-print d-flex gap-2 mb-3">
        <button onclick="window.print()" class="btn btn-primary btn-sm">
            <i class="bi bi-printer me-1"></i>Imprimir
        </button>
        <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

    <!-- Encabezado empresa -->
    <div class="row align-items-center mb-3">
        <div class="col-7">
            <h5 class="fw-bold mb-0 text-primary" th:text="${sunatRazonSocial ?: 'BOTICA SALUD S.A.C.'}">BOTICA SALUD S.A.C.</h5>
            <div class="small text-muted" th:text="'RUC: ' + ${sunatRuc}"></div>
            <div class="small text-muted" th:text="${sunatDireccion}"></div>
            <div class="small text-muted" th:text="${sunatDistrito + ' - ' + sunatProvincia}"></div>
        </div>
        <div class="col-5">
            <div class="comprobante-titulo">
                <div class="fw-bold"
                     th:text="${venta.tipoComprobante == '01'} ? 'FACTURA ELECTRÓNICA' : 'BOLETA DE VENTA'"></div>
                <div class="fs-5 fw-bold mt-1"
                     th:if="${comprobante != null}"
                     th:text="${comprobante.numeroFormateado}"></div>
            </div>
        </div>
    </div>

    <div class="linea"></div>

    <!-- Datos del cliente -->
    <div class="row small mb-3">
        <div class="col-6">
            <span class="text-muted">Cliente: </span>
            <strong th:text="${venta.clienteNombre ?: 'CLIENTE VARIOS'}"></strong>
        </div>
        <div class="col-3">
            <span class="text-muted" th:text="${venta.tipoComprobante == '01'} ? 'RUC: ' : 'DNI: '"></span>
            <strong th:text="${venta.clienteRucDni ?: '-'}"></strong>
        </div>
        <div class="col-3 text-end">
            <span class="text-muted">Fecha: </span>
            <strong th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}"></strong>
        </div>
    </div>

    <!-- Tabla de productos -->
    <table class="table table-sm small border mb-3">
        <thead class="table-primary">
        <tr>
            <th>Descripción</th>
            <th class="text-center" style="width:60px">Cant.</th>
            <th class="text-end" style="width:90px">P. Unit</th>
            <th class="text-end" style="width:90px">Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${venta.detalles}">
            <td>
                <div th:text="${d.producto.nombre}"></div>
                <div class="text-muted"
                     th:if="${d.producto.presentacion != null or d.producto.concentracion != null}"
                     th:text="${(d.producto.presentacion ?: '') + (d.producto.concentracion != null ? ' · ' + d.producto.concentracion : '')}"></div>
            </td>
            <td class="text-center" th:text="${d.cantidad}"></td>
            <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(d.precioUnitario,1,2)}"></td>
            <td class="text-end fw-semibold" th:text="${'S/ ' + #numbers.formatDecimal(d.subtotal,1,2)}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Totales -->
    <div class="row justify-content-end">
        <div class="col-md-5">
            <table class="table table-sm small mb-0">
                <tr>
                    <td class="text-muted">Subtotal (sin IGV)</td>
                    <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(venta.subtotal,1,2)}"></td>
                </tr>
                <tr>
                    <td class="text-muted">IGV (18%)</td>
                    <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(venta.igv,1,2)}"></td>
                </tr>
                <tr class="totales-row table-primary">
                    <td>TOTAL</td>
                    <td class="text-end text-success" th:text="${'S/ ' + #numbers.formatDecimal(venta.total,1,2)}"></td>
                </tr>
            </table>
        </div>
    </div>

    <div class="linea"></div>

    <!-- Total en letras -->
    <div class="small text-center text-muted mb-3" th:if="${comprobante != null}">
        Son: <strong th:text="${@servicioSunat.numeroALetras(venta.total)}"></strong>
    </div>

    <!-- Estado SUNAT -->
    <div th:if="${comprobante != null}" class="text-center">
        <span th:switch="${comprobante.estadoSunat}">
            <span th:case="'ACEPTADO'" class="badge bg-success sunat-badge">
                <i class="bi bi-check-circle me-1"></i>Comprobante Aceptado por SUNAT
            </span>
            <span th:case="'ERROR'" class="badge bg-warning text-dark sunat-badge">
                <i class="bi bi-exclamation-triangle me-1"></i>Pendiente de envío SUNAT
            </span>
            <span th:case="*" class="badge bg-secondary sunat-badge" th:text="${comprobante.estadoSunat}"></span>
        </span>
        <div class="text-muted mt-1" style="font-size:0.7rem"
             th:text="${comprobante.sunatMensaje}"></div>
    </div>

    <div class="text-center text-muted mt-3" style="font-size:0.7rem">
        Gracias por su compra - BOTICA SALUD | Tel: (01) 000-0000
    </div>
</div>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</body>
</html>
