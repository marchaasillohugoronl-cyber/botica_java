<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Ventas</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-receipt me-2 text-primary"></i>Ventas</h4>
        <a th:href="@{/ventas/nueva}" class="btn btn-primary">
            <i class="bi bi-cart-plus me-2"></i>Nueva Venta
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">#</th>
                        <th>Comprobante</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th class="text-end">Total</th>
                        <th class="text-center">SUNAT</th>
                        <th class="text-center">Fecha</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${ventas}">
                        <td class="ps-3 text-muted small" th:text="${v.id}"></td>
                        <td>
                            <span th:if="${v.comprobante != null}">
                                <span th:if="${v.tipoComprobante == '03'}" class="badge bg-info me-1">Boleta</span>
                                <span th:if="${v.tipoComprobante == '01'}" class="badge bg-primary me-1">Factura</span>
                                <span class="fw-semibold"
                                      th:text="${v.comprobante.numeroFormateado}"></span>
                            </span>
                            <span th:unless="${v.comprobante != null}" class="text-muted">Sin comprobante</span>
                        </td>
                        <td th:text="${v.clienteNombre ?: 'Cliente varios'}"></td>
                        <td class="small text-muted" th:text="${v.usuario.nombre}"></td>
                        <td class="text-end fw-bold text-success">
                            S/ <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span>
                        </td>
                        <td class="text-center">
                            <span th:if="${v.comprobante != null}">
                                <span th:switch="${v.comprobante.estadoSunat}">
                                    <span th:case="'ACEPTADO'" class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Aceptado</span>
                                    <span th:case="'RECHAZADO'" class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Rechazado</span>
                                    <span th:case="'ERROR'" class="badge bg-warning text-dark">Error</span>
                                    <span th:case="*" class="badge bg-secondary" th:text="${v.comprobante.estadoSunat}"></span>
                                </span>
                            </span>
                        </td>
                        <td class="text-center small text-muted"
                            th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-center">
                            <a th:href="@{/ventas/{id}/comprobante(id=${v.id})}"
                               class="btn btn-sm btn-outline-secondary"
                               title="Ver/Imprimir comprobante">
                                <i class="bi bi-printer"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>No hay ventas registradas
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
