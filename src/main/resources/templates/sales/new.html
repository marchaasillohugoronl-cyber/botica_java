<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Nueva Venta</title></head>
<body>
<section>
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0"><i class="bi bi-cart-plus me-2 text-primary"></i>Nueva Venta</h4>
    </div>

    <div class="row g-3">
        <!-- Panel izquierdo: búsqueda de productos -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white border-0 py-3">
                    <h6 class="fw-bold mb-0"><i class="bi bi-search me-2"></i>Agregar Productos</h6>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="buscarProducto" class="form-control"
                               placeholder="Buscar producto por nombre o código..."/>
                    </div>
                    <div id="resultadosBusqueda" class="list-group" style="max-height:300px;overflow-y:auto;"></div>
                </div>
            </div>

            <!-- Tabla de ítems del carrito -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <h6 class="fw-bold mb-0"><i class="bi bi-cart3 me-2"></i>Carrito</h6>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Producto</th>
                            <th class="text-center" style="width:100px">Cantidad</th>
                            <th class="text-end" style="width:100px">P. Unit</th>
                            <th class="text-end" style="width:100px">Subtotal</th>
                            <th style="width:40px"></th>
                        </tr>
                        </thead>
                        <tbody id="carritoBody">
                        <tr id="emptyCart">
                            <td colspan="5" class="text-center text-muted py-4">
                                <i class="bi bi-cart-x fs-3 d-block mb-1"></i>Agregue productos al carrito
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Panel derecho: datos del cliente y totales -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white border-0 py-3">
                    <h6 class="fw-bold mb-0"><i class="bi bi-person me-2"></i>Datos del Comprobante</h6>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Tipo de Comprobante</label>
                        <div class="d-flex gap-2">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoComp"
                                       id="tipoBoleta" value="03" checked/>
                                <label class="form-check-label" for="tipoBoleta">
                                    <span class="badge bg-info">Boleta</span>
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoComp"
                                       id="tipoFactura" value="01"/>
                                <label class="form-check-label" for="tipoFactura">
                                    <span class="badge bg-primary">Factura</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3" id="campoRucDni">
                        <label class="form-label fw-semibold small" id="labelDocumento">DNI del Cliente</label>
                        <input type="text" id="clienteRucDni" class="form-control"
                               placeholder="00000000" maxlength="11"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Nombre del Cliente</label>
                        <input type="text" id="clienteNombre" class="form-control"
                               placeholder="Opcional para boleta"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold small">Observación</label>
                        <input type="text" id="observacion" class="form-control" placeholder="Opcional"/>
                    </div>
                </div>
            </div>

            <!-- Totales -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted">Subtotal (sin IGV)</span>
                        <span>S/ <span id="subtotalVal">0.00</span></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">IGV (18%)</span>
                        <span>S/ <span id="igvVal">0.00</span></span>
                    </div>
                    <hr/>
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>TOTAL</span>
                        <span class="text-success">S/ <span id="totalVal">0.00</span></span>
                    </div>
                </div>
            </div>

            <div id="mensajeVenta" class="alert d-none mb-3"></div>

            <div class="d-grid gap-2">
                <button type="button" id="btnProcesar" class="btn btn-success btn-lg fw-bold"
                        onclick="procesarVenta()">
                    <i class="bi bi-check-circle me-2"></i>Procesar Venta
                </button>
                <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</section>

<script th:inline="javascript">
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    let carrito = [];

    // Búsqueda de productos con debounce
    let searchTimer;
    document.getElementById('buscarProducto').addEventListener('input', function () {
        clearTimeout(searchTimer);
        const q = this.value.trim();
        if (q.length < 2) {
            document.getElementById('resultadosBusqueda').innerHTML = '';
            return;
        }
        searchTimer = setTimeout(() => buscarProductos(q), 300);
    });

    function buscarProductos(q) {
        fetch(`/productos/api/buscar?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                const box = document.getElementById('resultadosBusqueda');
                if (!data.length) {
                    box.innerHTML = '<div class="list-group-item text-muted text-center py-3">Sin resultados</div>';
                    return;
                }
                box.innerHTML = data.map(p => `
                    <button type="button" class="list-group-item list-group-item-action py-2 px-3"
                            onclick="agregarAlCarrito(${p.id}, '${escapeHtml(p.nombre)}', '${escapeHtml(p.presentacion || '')}', ${p.precio}, ${p.stock})">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <div class="fw-semibold small">${escapeHtml(p.nombre)}</div>
                                <div class="text-muted" style="font-size:0.75rem">${escapeHtml(p.presentacion || '')}</div>
                            </div>
                            <div class="text-end">
                                <div class="fw-bold text-success">S/ ${p.precio.toFixed(2)}</div>
                                <div class="small text-muted">${p.stock} en stock</div>
                            </div>
                        </div>
                    </button>`).join('');
            });
    }

    function agregarAlCarrito(id, nombre, presentacion, precio, stock) {
        document.getElementById('buscarProducto').value = '';
        document.getElementById('resultadosBusqueda').innerHTML = '';

        const existente = carrito.find(i => i.id === id);
        if (existente) {
            if (existente.cantidad >= stock) {
                mostrarAlerta('Stock insuficiente para ' + nombre, 'warning');
                return;
            }
            existente.cantidad++;
            existente.subtotal = +(existente.cantidad * precio).toFixed(2);
        } else {
            carrito.push({ id, nombre, presentacion, precio, stock, cantidad: 1, subtotal: +precio.toFixed(2) });
        }
        renderCarrito();
    }

    function cambiarCantidad(id, delta) {
        const item = carrito.find(i => i.id === id);
        if (!item) return;
        const nueva = item.cantidad + delta;
        if (nueva < 1) { quitarItem(id); return; }
        if (nueva > item.stock) { mostrarAlerta('Stock máximo: ' + item.stock, 'warning'); return; }
        item.cantidad = nueva;
        item.subtotal = +(nueva * item.precio).toFixed(2);
        renderCarrito();
    }

    function quitarItem(id) {
        carrito = carrito.filter(i => i.id !== id);
        renderCarrito();
    }

    function renderCarrito() {
        const tbody = document.getElementById('carritoBody');
        const emptyRow = document.getElementById('emptyCart');

        if (!carrito.length) {
            tbody.innerHTML = `<tr id="emptyCart"><td colspan="5" class="text-center text-muted py-4">
                <i class="bi bi-cart-x fs-3 d-block mb-1"></i>Agregue productos al carrito</td></tr>`;
            actualizarTotales();
            return;
        }

        tbody.innerHTML = carrito.map(i => `
            <tr>
                <td class="ps-3">
                    <div class="fw-semibold small">${escapeHtml(i.nombre)}</div>
                    <div class="text-muted" style="font-size:0.75rem">${escapeHtml(i.presentacion)}</div>
                </td>
                <td class="text-center">
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${i.id}, -1)">-</button>
                        <span class="btn btn-outline-secondary disabled px-3">${i.cantidad}</span>
                        <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${i.id}, 1)">+</button>
                    </div>
                </td>
                <td class="text-end small">S/ ${i.precio.toFixed(2)}</td>
                <td class="text-end fw-semibold">S/ ${i.subtotal.toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="quitarItem(${i.id})">
                        <i class="bi bi-x"></i>
                    </button>
                </td>
            </tr>`).join('');

        actualizarTotales();
    }

    function actualizarTotales() {
        const total = carrito.reduce((s, i) => s + i.subtotal, 0);
        const subtotal = +(total / 1.18).toFixed(2);
        const igv = +(total - subtotal).toFixed(2);
        document.getElementById('totalVal').textContent = total.toFixed(2);
        document.getElementById('subtotalVal').textContent = subtotal.toFixed(2);
        document.getElementById('igvVal').textContent = igv.toFixed(2);
    }

    // Cambiar etiqueta RUC/DNI según tipo de comprobante
    document.querySelectorAll('input[name="tipoComp"]').forEach(r => {
        r.addEventListener('change', function () {
            const label = document.getElementById('labelDocumento');
            const input = document.getElementById('clienteRucDni');
            if (this.value === '01') {
                label.textContent = 'RUC del Cliente';
                input.placeholder = '20000000000';
                input.maxLength = 11;
            } else {
                label.textContent = 'DNI del Cliente';
                input.placeholder = '00000000';
                input.maxLength = 8;
            }
        });
    });

    function procesarVenta() {
        if (!carrito.length) {
            mostrarAlerta('Agregue al menos un producto al carrito.', 'danger');
            return;
        }
        const tipoComp = document.querySelector('input[name="tipoComp"]:checked').value;
        if (tipoComp === '01' && !document.getElementById('clienteRucDni').value) {
            mostrarAlerta('Para factura es obligatorio el RUC del cliente.', 'danger');
            return;
        }

        const payload = {
            tipoComprobante: tipoComp,
            clienteRucDni: document.getElementById('clienteRucDni').value,
            clienteNombre: document.getElementById('clienteNombre').value,
            observacion: document.getElementById('observacion').value,
            detalles: carrito.map(i => ({ productoId: i.id, cantidad: i.cantidad }))
        };

        const btn = document.getElementById('btnProcesar');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';

        fetch('/ventas/procesar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                mostrarAlerta(data.error, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Procesar Venta';
            } else {
                mostrarAlerta(`✓ Venta registrada. Comprobante: ${data.comprobante}`, 'success');
                setTimeout(() => window.location.href = `/ventas/${data.ventaId}/comprobante`, 1500);
            }
        })
        .catch(() => {
            mostrarAlerta('Error de conexión. Intente nuevamente.', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Procesar Venta';
        });
    }

    function mostrarAlerta(msg, tipo) {
        const el = document.getElementById('mensajeVenta');
        el.className = `alert alert-${tipo}`;
        el.textContent = msg;
        el.classList.remove('d-none');
        if (tipo !== 'danger') setTimeout(() => el.classList.add('d-none'), 4000);
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        })[c]);
    }
</script>
</body>
</html>
