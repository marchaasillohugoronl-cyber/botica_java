<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Dashboard</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard</h4>
        <span class="text-muted small" th:text="${#dates.format(#dates.createNow(), 'EEEE, dd MMMM yyyy')}"></span>
    </div>

    <!-- Tarjetas resumen -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-primary bg-opacity-10 p-3">
                        <i class="bi bi-box-seam fs-4 text-primary"></i>
                    </div>
                    <div>
                        <div class="fs-4 fw-bold" th:text="${totalProductos}">0</div>
                        <div class="text-muted small">Productos activos</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-success bg-opacity-10 p-3">
                        <i class="bi bi-receipt fs-4 text-success"></i>
                    </div>
                    <div>
                        <div class="fs-4 fw-bold" th:text="${ventasHoy}">0</div>
                        <div class="text-muted small">Ventas hoy</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-info bg-opacity-10 p-3">
                        <i class="bi bi-currency-dollar fs-4 text-info"></i>
                    </div>
                    <div>
                        <div class="fs-4 fw-bold">
                            S/ <span th:text="${#numbers.formatDecimal(totalHoy, 1, 2)}">0.00</span>
                        </div>
                        <div class="text-muted small">Total vendido hoy</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100"
                 th:classappend="${stockBajo > 0} ? 'border-warning border-start border-4' : ''">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="rounded-3 bg-warning bg-opacity-10 p-3">
                        <i class="bi bi-exclamation-triangle fs-4 text-warning"></i>
                    </div>
                    <div>
                        <div class="fs-4 fw-bold text-warning" th:text="${stockBajo}">0</div>
                        <div class="text-muted small">Stock bajo / por vencer</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Ventas recientes -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>Ventas Recientes</h6>
                    <a th:href="@{/ventas}" class="btn btn-sm btn-outline-primary">Ver todas</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-3">#</th>
                                <th>Cliente</th>
                                <th>Tipo</th>
                                <th>Total</th>
                                <th>Fecha</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="v : ${ventasRecientes}">
                                <td class="ps-3 text-muted small" th:text="${v.id}"></td>
                                <td th:text="${v.clienteNombre ?: 'Cliente varios'}"></td>
                                <td>
                                    <span th:if="${v.tipoComprobante == '03'}" class="badge bg-info">Boleta</span>
                                    <span th:if="${v.tipoComprobante == '01'}" class="badge bg-primary">Factura</span>
                                </td>
                                <td class="fw-semibold">S/ <span th:text="${#numbers.formatDecimal(v.total, 1, 2)}"></span></td>
                                <td class="text-muted small" th:text="${#temporals.format(v.fechaVenta, 'dd/MM HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/ventas/{id}/comprobante(id=${v.id})}"
                                       class="btn btn-sm btn-outline-secondary">
                                        <i class="bi bi-printer"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(ventasRecientes)}">
                                <td colspan="6" class="text-center text-muted py-4">No hay ventas registradas</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stock bajo -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 py-3">
                    <h6 class="mb-0 fw-bold text-warning">
                        <i class="bi bi-exclamation-triangle me-2"></i>Stock Bajo
                    </h6>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li th:each="p : ${productosStockBajo}"
                            class="list-group-item d-flex justify-content-between align-items-center py-3 px-3">
                            <div>
                                <div class="fw-semibold small" th:text="${p.nombre}"></div>
                                <div class="text-muted" style="font-size:0.75rem"
                                     th:text="${p.presentacion}"></div>
                            </div>
                            <span class="badge bg-danger rounded-pill" th:text="${p.stock} + ' uds'"></span>
                        </li>
                        <li th:if="${#lists.isEmpty(productosStockBajo)}"
                            class="list-group-item text-center text-muted py-4">
                            <i class="bi bi-check-circle text-success me-1"></i>Stock OK
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Accesos rápidos -->
    <div class="row g-3 mt-1">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Accesos Rápidos</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/ventas/nueva}" class="btn btn-primary">
                            <i class="bi bi-cart-plus me-2"></i>Nueva Venta
                        </a>
                        <a th:href="@{/productos/nuevo}" sec:authorize="hasRole('ADMIN')" class="btn btn-outline-primary">
                            <i class="bi bi-plus-circle me-2"></i>Nuevo Producto
                        </a>
                        <a th:href="@{/productos}" class="btn btn-outline-secondary">
                            <i class="bi bi-box-seam me-2"></i>Ver Productos
                        </a>
                        <a th:href="@{/ventas}" class="btn btn-outline-secondary">
                            <i class="bi bi-receipt me-2"></i>Ver Ventas
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
