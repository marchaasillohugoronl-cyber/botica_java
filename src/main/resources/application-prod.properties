# =============================================
# PRODUCCION - Sistema Botica (Render + Neon)
# Las variables con ${...} se configuran en el
# panel de Render como Environment Variables.
# =============================================

spring.application.name=Sistema Botica

# --- Base de datos PostgreSQL (Neon) ---
# En Render configurar: SPRING_DATASOURCE_URL
# Formato: jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - pool pequeño para Neon tier gratuito (max 5 conexiones)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Deshabilitar consola H2
spring.h2.console.enabled=false

# --- Thymeleaf ---
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# --- Subida de archivos ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=/tmp/botica/uploads/productos

# Cloudinary - almacenamiento persistente de imagenes
# Obtener en: cloudinary.com/console → API Keys
# Formato: cloudinary://api_key:api_secret@cloud_name
cloudinary.enabled=true
cloudinary.url=${CLOUDINARY_URL}

# --- Puerto (Render asigna el puerto via variable PORT) ---
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# --- Datos del emisor SUNAT (configurar en Render) ---
sunat.ruc=${SUNAT_RUC:20000000001}
sunat.razon-social=${SUNAT_RAZON_SOCIAL:BOTICA SALUD S.A.C.}
sunat.nombre-comercial=${SUNAT_NOMBRE_COMERCIAL:BOTICA SALUD}
sunat.ubigeo=${SUNAT_UBIGEO:150101}
sunat.direccion=${SUNAT_DIRECCION:AV. PRINCIPAL 123}
sunat.urbanizacion=URB. LOS JARDINES
sunat.distrito=${SUNAT_DISTRITO:LIMA}
sunat.provincia=${SUNAT_PROVINCIA:LIMA}
sunat.departamento=${SUNAT_DEPARTAMENTO:LIMA}
sunat.usuario-sol=${SUNAT_USUARIO_SOL:USUARIO_SOL_AQUI}
sunat.clave-sol=${SUNAT_CLAVE_SOL:CLAVE_SOL_AQUI}
sunat.serie-factura=F001
sunat.serie-boleta=B001
sunat.url-beta=https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService
sunat.url-produccion=https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService
sunat.modo=${SUNAT_MODO:beta}

# --- Logging ---
logging.level.com.botica=INFO
logging.level.org.springframework=WARN
