# =============================================
# SISTEMA BOTICA - Configuracion
# =============================================

spring.application.name=Sistema Botica

# --- Base de datos H2 (desarrollo) ---
spring.datasource.url=jdbc:h2:file:./data/boticadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Subida de archivos ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directorio donde se guardan las fotos de productos (desarrollo local)
app.upload.dir=./uploads/productos

# Cloudinary (desactivado en desarrollo - usar local)
cloudinary.enabled=false
cloudinary.url=

# --- Datos del emisor (SUNAT) ---
sunat.ruc=20000000001
sunat.razon-social=BOTICA SALUD S.A.C.
sunat.nombre-comercial=BOTICA SALUD
sunat.ubigeo=150101
sunat.direccion=AV. PRINCIPAL 123
sunat.urbanizacion=URB. LOS JARDINES
sunat.distrito=LIMA
sunat.provincia=LIMA
